<!-- Social Media Management Panel -->
<div id="social-media" class="tab-content">
  <!-- Status Overview -->
  <div class="cards-grid" id="platform-status">
    <!-- Dynamically populated -->
  </div>

  <!-- Create New Post -->
  <div class="card">
    <h3>📝 Create New Post</h3>
    <div class="form-group">
      <label>Post Type</label>
      <select id="post-type">
        <option value="travel_tip">Travel Tip</option>
        <option value="deal">Deal Alert</option>
        <option value="hack">Hack</option>
        <option value="engagement">Engagement</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="post-title" placeholder="Post title (optional)">
    </div>

    <div class="form-group">
      <label>Content</label>
      <textarea id="post-content" placeholder="Write your post content here..."></textarea>
      <small id="char-count">0/280 characters</small>
    </div>

    <div class="form-group">
      <label>Image URL (optional)</label>
      <input type="url" id="post-image" placeholder="https://example.com/image.jpg">
    </div>

    <div class="form-group">
      <label>Platforms to Post To</label>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
          <input type="checkbox" name="platforms" value="twitter"> 🐦 Twitter
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
          <input type="checkbox" name="platforms" value="reddit"> 🤖 Reddit
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
          <input type="checkbox" name="platforms" value="pinterest"> 📌 Pinterest
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
          <input type="checkbox" name="platforms" value="instagram"> 📸 Instagram
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
          <input type="checkbox" name="platforms" value="linkedin"> 💼 LinkedIn
        </label>
      </div>
    </div>

    <button onclick="publishPost()" class="btn btn-primary btn-large">
      📤 Publish Post
    </button>
  </div>

  <!-- Connected Accounts -->
  <div class="card">
    <h3>🔗 Connected Accounts</h3>
    <div id="accounts-list"></div>
    <button onclick="openConnectModal()" class="btn btn-secondary" style="margin-top: 15px;">
      + Connect New Account
    </button>
  </div>

  <!-- Recent Posts -->
  <div class="card">
    <h3>📋 Recent Posts</h3>
    <div class="table-container">
      <table id="recent-posts-table">
        <thead>
          <tr>
            <th>Posted</th>
            <th>Type</th>
            <th>Content</th>
            <th>Platforms</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="posts-tbody">
          <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Platform Configuration -->
  <div class="card">
    <h3>⚙️ Platform Settings</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
      <div>
        <label>Twitter Posting Frequency</label>
        <select id="twitter-frequency" onchange="savePlatformConfig('twitter')">
          <option value="daily">Once Daily</option>
          <option value="twice_daily">Twice Daily</option>
          <option value="custom">Custom Schedule</option>
        </select>
      </div>
      <div>
        <label>Reddit Posting Frequency</label>
        <select id="reddit-frequency" onchange="savePlatformConfig('reddit')">
          <option value="daily">Once Daily</option>
          <option value="twice_daily">Twice Daily</option>
          <option value="custom">Custom Schedule</option>
        </select>
      </div>
      <div>
        <label>Pinterest Posting Frequency</label>
        <select id="pinterest-frequency" onchange="savePlatformConfig('pinterest')">
          <option value="daily">Once Daily</option>
          <option value="twice_daily">Twice Daily</option>
          <option value="custom">Custom Schedule</option>
        </select>
      </div>
      <div>
        <label>Instagram Posting Frequency</label>
        <select id="instagram-frequency" onchange="savePlatformConfig('instagram')">
          <option value="daily">Once Daily</option>
          <option value="twice_daily">Twice Daily</option>
          <option value="custom">Custom Schedule</option>
        </select>
      </div>
      <div>
        <label>LinkedIn Posting Frequency</label>
        <select id="linkedin-frequency" onchange="savePlatformConfig('linkedin')">
          <option value="daily">Once Daily</option>
          <option value="twice_daily">Twice Daily</option>
          <option value="custom">Custom Schedule</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Analytics -->
  <div class="card">
    <h3>📊 Engagement Analytics</h3>
    <div style="text-align: center; padding: 20px; color: #6b7280;">
      Analytics coming soon...
    </div>
  </div>
</div>

<!-- Connect Account Modal -->
<div id="connect-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Connect Social Media Account</h3>
      <button class="close-modal" onclick="closeConnectModal()">×</button>
    </div>

    <div class="form-group">
      <label>Platform</label>
      <select id="connect-platform">
        <option value="">Select a platform...</option>
        <option value="twitter">🐦 Twitter</option>
        <option value="reddit">🤖 Reddit</option>
        <option value="pinterest">📌 Pinterest</option>
        <option value="instagram">📸 Instagram</option>
        <option value="linkedin">💼 LinkedIn</option>
      </select>
    </div>

    <div class="form-group">
      <label>Account Name</label>
      <input type="text" id="connect-account-name" placeholder="e.g., TravelSmarter Official">
    </div>

    <div class="form-group">
      <label>Access Token</label>
      <input type="password" id="connect-token" placeholder="Paste your API token here">
    </div>

    <div id="platform-specific-fields"></div>

    <button onclick="connectAccount()" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
      Connect Account
    </button>
  </div>
</div>
