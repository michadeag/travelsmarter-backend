<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TravelSmarter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1f2937;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: 500;
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f3f4f6;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            color: #6b7280;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: #e5e7eb;
            color: #1f2937;
        }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .settings-content h3 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>

    <div class="login-container">
        <div class="logo">🔐</div>
        <h1>Admin Login</h1>
        <p class="subtitle">TravelSmarter Control Panel</p>

        <div id="alert" class="alert"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="admin@travelsmarter.com"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me for 30 days</label>
            </div>

            <button type="submit" id="login-btn" class="login-btn">
                Sign In
            </button>
        </form>
    </div>

    <div id="settings-modal" class="settings-modal">
        <div class="settings-content">
            <h3>API Settings</h3>

            <div class="form-group">
                <label for="api-url">API URL</label>
                <input type="url" id="api-url" placeholder="https://api.travelsmarterapp.com">
            </div>

            <div class="settings-buttons">
                <button class="login-btn" style="margin: 0; flex: 1;" onclick="saveSettings()">Save</button>
                <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Determine API URL
        let API_URL;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            API_URL = localStorage.getItem('apiUrl') || 'http://localhost:5000';
        } else {
            API_URL = localStorage.getItem('apiUrl') || window.location.origin;
        }

        console.log('🔐 Admin Login using API:', API_URL);

        // Set API URL on page load
        document.getElementById('api-url').value = API_URL;

        // Check if already logged in
        const token = localStorage.getItem('adminToken');
        if (token) {
            // Try to verify token
            verifyToken();
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                showAlert('Please enter email and password', 'error');
                return;
            }

            // Show loading state
            btn.innerHTML = '<span class="spinner"></span>Signing in...';
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/admin-auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Login failed', 'error');
                    throw new Error(data.message);
                }

                // Store token and admin info
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminName', data.admin.firstName || data.admin.email);
                localStorage.setItem('adminEmail', data.admin.email);
                localStorage.setItem('adminRole', data.admin.role);
                localStorage.setItem('apiUrl', API_URL);

                if (remember) {
                    localStorage.setItem('rememberMe', 'true');
                    // Token expires in 24h, so set remember for 30 days with refresh logic
                    localStorage.setItem('tokenExpiresAt', new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString());
                }

                showAlert('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.message || 'Login failed. Please try again.', 'error');
            } finally {
                btn.innerHTML = 'Sign In';
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function verifyToken() {
            try {
                const token = localStorage.getItem('adminToken');
                const response = await fetch(`${API_URL}/api/admin-auth/verify-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    // Token is valid, redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Token is invalid, clear it
                    localStorage.removeItem('adminToken');
                }
            } catch (error) {
                console.error('Token verification error:', error);
                localStorage.removeItem('adminToken');
            }
        }

        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;

            if (type === 'error') {
                setTimeout(() => {
                    alertEl.classList.remove('show');
                }, 5000);
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('show');
        }

        function saveSettings() {
            const apiUrl = document.getElementById('api-url').value.trim();
            if (!apiUrl) {
                alert('Please enter API URL');
                return;
            }
            localStorage.setItem('apiUrl', apiUrl);
            API_URL = apiUrl;
            showAlert('✅ Settings saved', 'success');
            closeSettings();
        }

        // Focus email input on load
        document.getElementById('email').focus();
    </script>
</body>
</html>
